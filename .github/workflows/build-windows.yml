name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build portable EXE
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Windows portable artifact
        run: npm run package:win

      - name: Verify artifact name and Windows metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "Tridibox-3MF-to-U1-Desktop-$($package.version)-Portable.exe"
          $path = Join-Path "release" $expected
          if (-not (Test-Path $path)) {
            throw "Expected artifact not found: $path"
          }

          $metadata = (Get-Item $path).VersionInfo
          if ($metadata.ProductName -ne "Tridibox 3MF to U1") {
            throw "Unexpected ProductName: $($metadata.ProductName)"
          }
          if (-not $metadata.ProductVersion.StartsWith($package.version)) {
            throw "Unexpected ProductVersion: $($metadata.ProductVersion)"
          }

          $signature = Get-AuthenticodeSignature $path
          if ($signature.Status -ne "NotSigned") {
            throw "Build output must be unsigned before SignPath submission: $($signature.Status)"
          }

          Get-FileHash -Algorithm SHA256 $path | Format-List

      - name: Upload unsigned artifact for SignPath
        uses: actions/upload-artifact@v4
        with:
          name: tridibox-windows-unsigned-${{ github.sha }}
          path: |
            release/Tridibox-3MF-to-U1-Desktop-*-Portable.exe
            release/Tridibox-3MF-to-U1-Desktop-*-Codigo-Fuente.zip
          if-no-files-found: error
          retention-days: 30

